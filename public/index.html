<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nick 🎬</title>
<script src="/socket.io/socket.io.js"></script>
<style>
body{font-family:Arial;background:#111;color:#fff;margin:0;padding:10px}
header{background:#e60023;padding:12px;text-align:center;font-size:22px;font-weight:bold;border-radius:10px}
input,button,textarea{padding:10px;margin:5px 0;border-radius:8px;border:none;width:100%;box-sizing:border-box}
button{background:#e60023;color:#fff;font-weight:bold;cursor:pointer}
.post{background:#222;padding:10px;border-radius:10px;margin:10px 0}
video{width:100%;border-radius:10px;background:#000}
.pendente{filter:brightness(0);background:#000}
#chatBox{background:#000;height:250px;overflow:auto;padding:10px;border-radius:10px;margin-top:10px}
.msg{background:#333;padding:8px;border-radius:8px;margin:5px 0}
audio{width:100%}
.admin-btns button{width:48%;display:inline-block}
</style>
</head>
<body>
<header>Nick 🎬</header>

<input id="meuNome" placeholder="Teu nome ex: Edgar">
<input type="file" id="videoFile" accept="video/*">
<input id="legenda" placeholder="Legenda do vídeo...">
<button onclick="publicar()">📤 Publicar Vídeo</button>
<button onclick="abrirChat()">💬 Conversar</button>

<div id="feed"></div>

<div id="chatArea" style="display:none">
<h3>💬 Conversa</h3>
<div id="chatBox"></div>
<input id="msgTexto" placeholder="Escreve...">
<button onclick="enviarMsg()">Enviar</button>
<button onmousedown="comecarAudio()" onmouseup="pararAudio()" ontouchstart="comecarAudio()" ontouchend="pararAudio()">🎤 Segura para falar</button>
<p style="font-size:12px">Segura no 🎤 para gravar, larga para enviar</p>
</div>

<script>
const socket = io();
const params = new URLSearchParams(location.search);
const isAdmin = params.get('admin') === '1';
let posts = [];
let recorder, chunks = [];

function publicar(){
  const file = document.getElementById('videoFile').files[0];
  const legenda = document.getElementById('legenda').value;
  const nome = document.getElementById('meuNome').value || 'Anónimo';
  if(!file) return alert('Escolhe um vídeo primeiro');
  const reader = new FileReader();
  reader.onload = () => {
    socket.emit('novo-post', {nome, legenda, video: reader.result, data: new Date().toLocaleString()});
    alert('Enviado! Vai ficar preto até ser aprovado.');
    document.getElementById('legenda').value='';
  };
  reader.readAsDataURL(file);
}

function mostrar(){
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  posts.slice().reverse().forEach(p => {
    const podeVer = p.aprovado || isAdmin;
    const div = document.createElement('div');
    div.className = 'post';
    let videoHtml = '';
    if(podeVer){
      videoHtml = `<video src="${p.video}" controls class="${!p.aprovado ? 'pendente' : ''}"></video>`;
    } else {
      videoHtml = `<video class="pendente"></video><p>⏳ A aguardar aprovação</p>`;
    }
    let botoes = '';
    if(isAdmin && !p.aprovado){
      botoes = `<div class="admin-btns"><button onclick="aprovar(${p.id})">✅ Aprovar</button><button onclick="apagar(${p.id})">❌ Apagar</button></div>`;
    }
    if(isAdmin && p.aprovado){
      botoes = `<button onclick="apagar(${p.id})">❌ Apagar</button>`;
    }
    div.innerHTML = `<b>${p.nome}</b> - ${p.data}<br>${p.legenda || ''}<br>${videoHtml}${botoes}`;
    feed.appendChild(div);
  });
  if(isAdmin) document.body.insertAdjacentHTML('afterbegin','<p style="background:green;padding:8px;border-radius:8px;text-align:center">MODO ADMIN ATIVO ✅</p>');
}

function aprovar(id){ socket.emit('aprovar-post', id); }
function apagar(id){ socket.emit('apagar-post', id); }

function abrirChat(){
  document.getElementById('chatArea').style.display='block';
  window.scrollTo(0, document.body.scrollHeight);
}
function enviarMsg(){
  const nome = document.getElementById('meuNome').value || 'Anónimo';
  const texto = document.getElementById('msgTexto').value;
  if(!texto) return;
  socket.emit('mensagem', {nome, texto, data: new Date().toLocaleString()});
  document.getElementById('msgTexto').value='';
}
function addMsg(m){
  const box = document.getElementById('chatBox');
  const d = document.createElement('div');
  d.className='msg';
  d.innerHTML = `<b>${m.nome}:</b> ${m.texto || ''} ${m.audio ? `<audio src="${m.audio}" controls></audio>` : ''}<br><small>${m.data||''}</small>`;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

async function comecarAudio(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    recorder = new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      const blob = new Blob(chunks, {type:'audio/webm'});
      const reader = new FileReader();
      reader.onload = () => {
        const nome = document.getElementById('meuNome').value || 'Anónimo';
        socket.emit('mensagem-audio', {nome, audio: reader.result, data: new Date().toLocaleString()});
      };
      reader.readAsDataURL(blob);
    };
    recorder.start();
  }catch(e){ alert('Permite o microfone para gravar'); }
}
function pararAudio(){ if(recorder) recorder.stop(); }

socket.on('posts-iniciais', d => { posts = d; mostrar(); });
socket.on('novo-post', p => { posts.push(p); mostrar(); });
socket.on('post-aprovado', id => { const p = posts.find(x=>x.id==id); if(p) p.aprovado=true; mostrar(); });
socket.on('post-apagado', id => { posts = posts.filter(x=>x.id!=id); mostrar(); });
socket.on('mensagens-iniciais', msgs => msgs.forEach(addMsg));
socket.on('mensagem', addMsg);
socket.on('mensagem-audio', addMsg);
</script>
</body>
</html>
