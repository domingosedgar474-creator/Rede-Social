<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nick</title>
<style>body{font-family:Arial;background:#111;color:#fff;padding:10px}video,audio{width:100%;border-radius:10px}.card{background:#222;padding:10px;border-radius:10px;margin-bottom:12px}.noir{background:#000;height:280px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:10px}button{padding:10px 12px;border-radius:10px;border:none;margin:3px}input{width:100%;padding:10px;margin:5px 0;border-radius:8px;box-sizing:border-box}.msg{background:#222;padding:8px;border-radius:10px;margin:5px 0}.me{background:#0a7a42}.top{display:flex;gap:5px}.top button{flex:1}</style>
</head><body>
<h1>Nick 🎬</h1>
<input type="text" id="meuNome" placeholder="Teu nome... Ex: Edgar">
<div class="top">
<button onclick="mostrar('videos')" style="background:#333;color:#fff">🎬 Vídeos</button>
<button onclick="mostrar('chat')" style="background:#00c853;color:#fff">💬 Conversar</button>
</div>

<div id="tela-videos">
<input type="file" id="videoFile" accept="video/*">
<input type="text" id="legenda" placeholder="Legenda...">
<button onclick="publicar()" style="background:#00c853;color:#fff;width:100%">Publicar Vídeo</button>
<p id="msg"></p>
<div id="lista"></div>
</div>

<div id="tela-chat" style="display:none">
<p>Link para convidar: <b id="meuLink"></b> <button onclick="copiarLink()">Copiar Link</button></p>
<div id="chatBox" style="max-height:400px;overflow-y:auto"></div>
<div style="display:flex;gap:5px">
<input type="text" id="textoMsg" placeholder="Escreve..." style="flex:1">
<button onclick="enviarTexto()" style="background:#00c853;color:#fff">Enviar</button>
</div>
<button id="btnMic" onmousedown="comecarAudio()" onmouseup="pararAudio()" ontouchstart="comecarAudio()" ontouchend="pararAudio()" style="background:#ff5722;color:#fff;width:100%;margin-top:5px">🎤 Segura para falar - máx 3 min</button>
<p id="statusAudio" style="text-align:center"></p>
</div>

<script>
let telaAtual='videos';
function mostrar(t){ telaAtual=t; document.getElementById('tela-videos').style.display=t=='videos'?'block':'none'; document.getElementById('tela-chat').style.display=t=='chat'?'block':'none'; if(t=='chat') carregarChat(); }
document.getElementById('meuLink').innerText = location.origin + '/';
function copiarLink(){ navigator.clipboard.writeText(location.origin + '/'); alert('Link copiado! Envia ao teu amigo.'); }

const PROIBIDO=['xxx','porn','porno','hentai','nudes','nude','sexo','sex','onlyfans'];
function eProibido(t){ if(!t) return false; t=t.toLowerCase(); return PROIBIDO.some(p=>t.includes(p)); }

async function publicar(){
  const f=document.getElementById('videoFile').files[0];
  const legenda=document.getElementById('legenda').value;
  if(!f) return alert('Escolhe um vídeo');
  if(eProibido(legenda) || eProibido(f.name)) return alert('Conteúdo não permitido.');
  const fd=new FormData(); fd.append('video',f); fd.append('legenda',legenda);
  document.getElementById('msg').innerText='A enviar...';
  const r=await fetch('/upload',{method:'POST',body:fd});
  if(!r.ok) return document.getElementById('msg').innerText='Bloqueado';
  document.getElementById('msg').innerText='Enviado! ⏳ A aguardar aprovação.';
  carregar();
}
async function carregar(){
  const souAdmin = location.search.includes('admin=1');
  const url = souAdmin ? '/admin-videos' : '/videos';
  const res = await fetch(url); const vids = await res.json();
  const div = document.getElementById('lista');
  div.innerHTML = vids.map(v=>{
    let media = (!v.aprovado && !souAdmin) ? `<div class="noir">⏳<br>A aguardar aprovação</div>` : `<video src="${v.url}" controls></video>`;
    let botoes = souAdmin ? `<br><button onclick="aprovar(${v.id})" style="background:#00c853;color:#fff">✅ Aprovar</button><button onclick="apagar(${v.id})" style="background:red;color:#fff">❌ Apagar</button>` : `<br><button onclick="denunciar(${v.id})">🚩 Denunciar</button>`;
    return `<div class="card">${media}<p>${v.legenda||''}</p>${botoes}</div>`;
  }).join('');
}
async function aprovar(id){ await fetch('/aprovar/'+id,{method:'POST'}); carregar(); }
async function apagar(id){ if(confirm('Apagar?')){ await fetch('/apagar/'+id,{method:'POST'}); carregar(); } }
async function denunciar(id){ await fetch('/denunciar/'+id,{method:'POST'}); alert('Obrigado.'); }
carregar();

async function carregarChat(){
  const res = await fetch('/mensagens'); const lista = await res.json();
  const meuNome = document.getElementById('meuNome').value;
  document.getElementById('chatBox').innerHTML = lista.map(m=>{
    const souEu = m.nome === meuNome;
    if(m.tipo==='audio') return `<div class="msg ${souEu?'me':''}"><b>${m.nome}</b><br><audio src="${m.url}" controls></audio></div>`;
    return `<div class="msg ${souEu?'me':''}"><b>${m.nome}:</b> ${m.texto}</div>`;
  }).join('');
  const box=document.getElementById('chatBox'); box.scrollTop=box.scrollHeight;
}
async function enviarTexto(){
  const nome=document.getElementById('meuNome').value || 'Anónimo';
  const texto=document.getElementById('textoMsg').value;
  if(!texto) return;
  if(eProibido(texto)) return alert('Palavra proibida');
  await fetch('/mensagem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome,texto})});
  document.getElementById('textoMsg').value=''; carregarChat();
}
let mediaRecorder=null, chunks=[], timerAudio=null, segundos=0;
async function comecarAudio(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder = new MediaRecorder(stream); chunks=[]; segundos=0;
    document.getElementById('statusAudio').innerText='🔴 A gravar... 0:00 / 3:00 - larga para enviar';
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t=>t.stop());
      document.getElementById('statusAudio').innerText='A enviar áudio...';
      const blob = new Blob(chunks,{type:'audio/webm'});
      const fd=new FormData(); fd.append('audio',blob,'audio.webm'); fd.append('nome', document.getElementById('meuNome').value || 'Anónimo');
      await fetch('/mensagem-audio',{method:'POST',body:fd});
      document.getElementById('statusAudio').innerText='Áudio enviado ✅';
      carregarChat();
    };
    mediaRecorder.start();
    timerAudio=setInterval(()=>{
      segundos++; let m=Math.floor(segundos/60), s=segundos%60;
      document.getElementById('statusAudio').innerText=`🔴 A gravar... ${m}:${s<10?'0'+s:s} / 3:00 - larga para enviar`;
      if(segundos>=180){ pararAudio(); }
    },1000);
  }catch(e){ alert('Precisas permitir o microfone'); }
}
function pararAudio(){
  if(mediaRecorder && mediaRecorder.state==='recording'){ clearInterval(timerAudio); mediaRecorder.stop(); }
}
setInterval(()=>{ if(telaAtual==='chat') carregarChat(); },3000);
</script>
</body></html>
