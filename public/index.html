<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NICK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#e5e5e5;display:flex;justify-content:center}
.phone{width:100%;max-width:420px;min-height:100vh;background:#fff;display:flex;flex-direction:column}
.top{padding:16px 20px 0;display:flex;flex-direction:column;gap:2px}
.top b{font-size:14px}.top span{font-size:18px;cursor:pointer}
.meio{flex:1;padding:20px;display:flex;flex-direction:column;justify-content:center}
.card{position:relative}
.bolinha{position:absolute;top:-14px;left:-6px;width:38px;height:38px;border-radius:50%;border:2px solid #fff;background:#ddd;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;z-index:5}
.bolinha img{width:100%;height:100%;object-fit:cover}
.foto{width:100%;border-radius:14px;display:block;max-height:340px;object-fit:cover}
.baixo{display:flex;justify-content:space-between;padding:14px 20px 22px}
.btn-camara{background:#fff;border:1px solid #ddd;padding:9px 16px;border-radius:22px;font-size:15px;cursor:pointer}
/* TELAS */
.tela{position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:420px;height:100vh;background:#fff;z-index:200;transition:.3s;display:flex;flex-direction:column}
.tela.aberto{transform:translateX(-50%) translateY(0)}
.amigo{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #eee;cursor:pointer}
.amigo-foto{width:44px;height:44px;border-radius:50%;background:#ddd;display:flex;align-items:center;justify-content:center;overflow:hidden}
.msg{max-width:80%;padding:10px 14px;border-radius:18px;background:#000;color:#fff;align-self:flex-end;font-size:15px}
.msg img{width:100%;border-radius:10px;display:block}
input{outline:none}
</style>
</head>
<body>

<div class="phone">
  <div class="top"><b>NICK</b><span onclick="abrirAmigos()">💬</span></div>

  <div class="meio" id="meio">
    <div class="card">
      <div class="bolinha" onclick="abrirPerfil()">👤</div>
      <img class="foto" id="fotoPrincipal" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800">
    </div>
    <p style="font-size:14px;margin-top:8px">Minha foto</p>
  </div>

  <div class="baixo">
    <button class="btn-camara" onclick="document.getElementById('fileFoto').click()">📷 Câmara</button>
  </div>
</div>

<input type="file" id="fileFoto" accept="image/*" hidden onchange="trocarFoto(event)">
<input type="file" id="fileChat" accept="image/*" hidden onchange="enviarFoto(event)">

<!-- 1. LISTA DE AMIGOS -->
<div class="tela" id="telaAmigos">
  <div style="display:flex;gap:10px;padding:14px;border-bottom:1px solid #eee;align-items:center">
    <span onclick="fecharAmigos()" style="font-size:26px;cursor:pointer">‹</span><b>Mensagens</b>
  </div>
  <div class="amigo" onclick="abrirChat('Edgar')"><div class="amigo-foto">👤</div><b>Edgar</b></div>
  <div class="amigo" onclick="abrirChat('NICK')"><div class="amigo-foto">👤</div><b>NICK</b></div>
  <div class="amigo" onclick="abrirChat('Amigo')"><div class="amigo-foto">👤</div><b>Amigo</b></div>
</div>

<!-- 2. CHAT COM O AMIGO -->
<div class="tela" id="telaChat">
  <div style="display:flex;gap:10px;padding:14px;border-bottom:1px solid #eee;align-items:center">
    <span onclick="voltarAmigos()" style="font-size:26px;cursor:pointer">‹</span>
    <div class="amigo-foto">👤</div><b id="chatNome" style="flex:1">Amigo</b>
  </div>
  <div id="chatMsgs" style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px">
    <p style="color:#999;text-align:center;margin-top:40px">Escreve a primeira mensagem</p>
  </div>
  <div style="display:flex;gap:8px;padding:10px;border-top:1px solid #eee;align-items:center">
    <button onclick="document.getElementById('fileChat').click()" style="width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid #ddd;cursor:pointer">📷</button>
    <input id="chatInput" placeholder="Escrever mensagem..." style="flex:1;padding:9px 14px;border-radius:25px;border:1px solid #ddd;background:#f8f8f8">
    <button onclick="enviarMsg()" style="width:38px;height:38px;border-radius:50%;background:#000;color:#fff;border:none;cursor:pointer">➜</button>
  </div>
</div>

<!-- 3. PERFIL DA BOLINHA -->
<div class="tela" id="telaPerfil">
  <span onclick="fecharPerfil()" style="font-size:26px;cursor:pointer;padding:14px">‹ Voltar</span>
  <div style="width:110px;height:110px;border-radius:50%;background:#ddd;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:40px">👤</div>
  <h2 style="text-align:center;margin-top:10px">Edgar Domingos</h2>
  <p style="text-align:center;color:#666;font-size:14px;margin-top:6px">Perfil da pessoa que publicou</p>
  <button onclick="abrirChat('Edgar Domingos')" style="margin:16px;padding:13px;border-radius:12px;background:#000;color:#fff;border:none;font-weight:bold;cursor:pointer">💬 Enviar mensagem</button>
</div>

<script>
function trocarFoto(e){
  let f=e.target.files[0];if(!f)return;
  document.getElementById('fotoPrincipal').src=URL.createObjectURL(f);
}
function abrirPerfil(){document.getElementById('telaPerfil').classList.add('aberto')}
function fecharPerfil(){document.getElementById('telaPerfil').classList.remove('aberto')}
function abrirAmigos(){document.getElementById('telaAmigos').classList.add('aberto')}
function fecharAmigos(){document.getElementById('telaAmigos').classList.remove('aberto')}
function abrirChat(nome){
  document.getElementById('telaAmigos').classList.remove('aberto');
  document.getElementById('telaPerfil').classList.remove('aberto');
  document.getElementById('telaChat').classList.add('aberto');
  document.getElementById('chatNome').textContent=nome;
  setTimeout(()=>document.getElementById('chatInput').focus(),200);
}
function voltarAmigos(){document.getElementById('telaChat').classList.remove('aberto');document.getElementById('telaAmigos').classList.add('aberto')}
function enviarMsg(){
  let inp=document.getElementById('chatInput');let txt=inp.value.trim();if(!txt)return;
  let el=document.getElementById('chatMsgs');
  if(el.querySelector('p')) el.innerHTML='';
  el.innerHTML+=`<div class="msg">${txt}</div>`; inp.value='';
}
function enviarFoto(e){
  let f=e.target.files[0];if(!f)return;
  let el=document.getElementById('chatMsgs');
  if(el.querySelector('p')) el.innerHTML='';
  el.innerHTML+=`<div class="msg"><img src="${URL.createObjectURL(f)}"></div>`;
}
document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')enviarMsg()});
</script>
</body>
</html>
