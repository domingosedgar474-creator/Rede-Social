<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nick</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,Arial,sans-serif}
body{background:#fff;display:flex;justify-content:center}
.phone{width:100%;max-width:390px;height:100dvh;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column}
.hidden{display:none!important}
.page{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 4px}
.msg-btn{position:relative;font-size:22px;background:none;border:none;cursor:pointer}
.badge{position:absolute;top:-6px;right:-8px;background:#e63b2e;color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-weight:700}
.nick{color:#6aa3e8;font-size:13px;font-weight:600}
.invite{font-size:12px;background:#2f7bf6;color:#fff;border:none;border-radius:14px;padding:5px 10px;cursor:pointer}
.home{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:16px 12px 0}
.video-wrap{position:relative;width:92%;height:260px;margin:0 auto;border-radius:14px;overflow:hidden;background:#000;flex-shrink:0}
.video-wrap video{width:100%;height:100%;object-fit:contain;background:#000}
.publisher{position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;background:#ddd;border:2px solid #fff;overflow:hidden;z-index:2;pointer-events:none}
.publisher img{width:100%;height:100%;object-fit:cover;display:none}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:3}
.play span{width:52px;height:52px;border:2.5px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;padding-left:3px;background:rgba(0,0,0,.25)}
.counter{font-size:11px;color:#888;text-align:center;margin-top:6px}
.mini-frame{margin:10px 8px 0;background:#f8f9ff;border:1px solid #e8eaff;border-radius:14px;padding:8px 10px;flex-shrink:0}
.mini-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mini-top b{font-size:12px;color:#111}
.mini-top span{font-size:10px;color:#2f7bf6;font-weight:700;cursor:pointer}
.mini-list{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.mini-list::-webkit-scrollbar{display:none}
.mini-item{min-width:92px;max-width:92px;height:78px;background:#fff;border:1px solid #eee;border-radius:10px;overflow:hidden;position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.mini-item img{width:100%;height:100%;object-fit:cover}
.mini-item p{font-size:11px;line-height:1.3;padding:6px;text-align:center;color:#222;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.mini-empty{min-width:100%;height:78px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#999;text-align:center}
.dots{padding:10px 0 12px;text-align:center;font-size:16px;letter-spacing:2px;cursor:pointer}
.head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.chat-item{display:flex;gap:10px;align-items:center;padding:11px 14px;cursor:pointer;border-bottom:1px solid #f0f0f0}
.avatar{width:36px;height:36px;border-radius:50%;background:#ddd;flex-shrink:0}
.chat-item b{font-size:14px}
.chat-item p{font-size:11px;color:#666;margin-top:1px}
.arrow{margin-left:auto;color:#aaa}
.chat-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #eee}
.back{font-size:20px;background:none;border:none;cursor:pointer}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:80%;padding:8px 10px;border-radius:14px;font-size:13px;word-break:break-word}
.me{background:#2f7bf6;color:#fff;align-self:flex-end}
.other{background:#ededed;align-self:flex-start}
.send-row{display:flex;gap:8px;padding:10px 12px;align-items:center;border-top:1px solid #eee}
.send-row input{flex:1;border:none;background:#f0f0f0;border-radius:20px;padding:9px 12px;font-size:13px;outline:none}
.send-btn{width:34px;height:34px;border-radius:50%;background:#2f7bf6;color:#fff;border:none;font-size:16px;cursor:pointer}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;padding:10px 14px 18px;box-shadow:0 -5px 20px rgba(0,0,0,.2);z-index:10}
.sheet .bar{width:36px;height:4px;background:#ddd;border-radius:10px;margin:0 auto 10px}
.sheet h3{font-size:14px;text-align:center;margin-bottom:12px}
.pub-grid{display:flex;justify-content:space-around;flex-wrap:wrap;gap:10px}
.pub-grid button{background:none;border:none;cursor:pointer;font-size:12px}
.pub-icon{width:52px;height:52px;background:#eef1f5;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 5px}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:5}
.cam-box{position:absolute;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
.cam-box video{flex:1;width:100%;object-fit:cover}
.cam-box button{padding:12px;background:#fff;border:none;font-size:13px;cursor:pointer}
.toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:#111;color:#fff;font-size:12px;padding:8px 12px;border-radius:20px;z-index:50;white-space:nowrap}
.text-box{position:absolute;left:12px;right:12px;bottom:70px;background:#fff;border-radius:16px;padding:12px;box-shadow:0 -5px 20px rgba(0,0,0,.2);z-index:15}
.text-box textarea{width:100%;height:70px;border:1px solid #eee;border-radius:10px;padding:8px;font-size:13px;outline:none;resize:none}
.text-box button{margin-top:8px;width:100%;padding:10px;background:#2f7bf6;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="phone">
<div id="home" class="page">
<div class="top"><button class="msg-btn" onclick="openMessages()">💬 <span class="badge hidden" id="badge"></span></button><span class="nick">Nick</span><button class="invite" onclick="invite()">Convidar</button></div>
<div class="home">
<div class="video-wrap" id="videoWrap"><div class="publisher" id="publisher"><img id="publisherImg"></div><video id="videoEl" playsinline loop preload="auto"></video><div class="play" id="playBtn"><span>▶</span></div></div><p class="counter" id="counter"></p>
<div class="mini-frame"><div class="mini-top"><b>Letras & Fotos</b><span onclick="openPublish()">+ Publicar</span></div><div class="mini-list" id="miniList"></div></div>
</div>
<div class="dots" onclick="openPublish()">•••</div>
</div>
<div id="messages" class="page hidden"><div class="head"><button class="back" onclick="goHome()">←</button><b></b><button class="invite" onclick="invite()">Convidar</button></div><div id="chatList"></div></div>
<div id="chat" class="page hidden"><div class="chat-head"><button class="back" onclick="openMessages()">←</button><div class="avatar"></div><div><b id="chatName" style="font-size:14px"></b></div></div><div class="msgs" id="msgs"></div><div class="send-row"><input id="msgInput" placeholder="Escrever mensagem..." autocomplete="off"><button class="send-btn" onclick="sendMsg()">➤</button></div></div>
<div id="overlay" class="overlay hidden" onclick="closePublish()"></div>
<div id="sheet" class="sheet hidden"><div class="bar"></div><h3>Publicar</h3><div class="pub-grid"><button onclick="document.getElementById('galInput').click()"><div class="pub-icon">🎬</div>Vídeo</button><button onclick="openTextBox()"><div class="pub-icon">✍️</div>Letras</button><button onclick="document.getElementById('photoInput').click()"><div class="pub-icon">🖼️</div>Foto</button><button onclick="openCamera()"><div class="pub-icon">📷</div>Câmara</button></div><input type="file" id="galInput" hidden accept="video/*"><input type="file" id="photoInput" hidden accept="image/*"></div>
<div id="textBox" class="text-box hidden"><b style="font-size:13px">Escreve letras</b><textarea id="textInput" placeholder="Escreve aqui..."></textarea><button onclick="publishText()">Publicar letras</button><button onclick="closeTextBox()" style="background:#eee;color:#111;margin-top:6px">Cancelar</button></div>
<div id="camBox" class="cam-box hidden"><video id="camVideo" autoplay playsinline></video><button onclick="closeCamera()">✕</button></div>
<div id="toast" class="toast hidden"></div>
</div>
<script>
(function(){ "use strict"; try{
localStorage.removeItem("nick_app_v1");
var store={chats:{},feed:[],myPhoto:"",unread:0,mini:[]};
try{var s=localStorage.getItem("nick_app_v2"); if(s) store=JSON.parse(s)||store;}catch(e){}
var chats=store.chats||{}; var feed=[]; var mini=store.mini||[]; var current=""; var feedIndex=0; var myPhoto=store.myPhoto||""; var unread=store.unread||0;
var userTouched=false;
function save(){try{
  var cleanFeed = (feed||[]).filter(function(f){ return f && f.url && f.url.indexOf("blob:")!==0; });
  localStorage.setItem("nick_app_v2",JSON.stringify({chats:chats,feed:cleanFeed,myPhoto:myPhoto,unread:unread,mini:mini}));
}catch(e){}}
function toast(t){var el=document.getElementById("toast"); if(!el) return; el.textContent=t; el.classList.remove("hidden"); clearTimeout(el._t); el._t=setTimeout(function(){el.classList.add("hidden");},2000);}
function esc(v){return String(v||"").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function updateBadge(){var b=document.getElementById("badge"); if(!b) return; if(unread>0){b.textContent=unread; b.classList.remove("hidden");} else {b.textContent=""; b.classList.add("hidden");} save();}
window.receiveMsg=function(name,text){try{if(!name||!text) return; if(!chats[name]) chats[name]={msgs:[]}; chats[name].msgs.push(["other",text]); if(current!==name){unread++; updateBadge();} if(current===name) renderMsgs(); if(!document.getElementById("messages").classList.contains("hidden")) renderList(); save();}catch(e){}};
function renderMini(){
var el=document.getElementById("miniList"); if(!el) return; el.innerHTML="";
if(!mini.length){ el.innerHTML='<div class="mini-empty">Ainda nada.<br>Toca em + Publicar para pôr letras ou foto.</div>'; return; }
mini.slice().reverse().forEach(function(m){
var d=document.createElement("div"); d.className="mini-item";
if(m.type==="photo"){ d.innerHTML='<img src="'+m.data+'">'; } else { d.innerHTML='<p>'+esc(m.data)+'</p>'; }
el.appendChild(d);
});
}
window.openTextBox=function(){ closePublish(); var b=document.getElementById("textBox"); if(b) b.classList.remove("hidden"); var ta=document.getElementById("textInput"); if(ta) setTimeout(function(){ta.focus();},100); };
window.closeTextBox=function(){ var b=document.getElementById("textBox"); if(b) b.classList.add("hidden"); };
window.publishText=function(){ var ta=document.getElementById("textInput"); if(!ta||!ta.value.trim()) return; mini.push({type:"text",data:ta.value.trim()}); ta.value=""; window.closeTextBox(); renderMini(); save(); toast("Letras publicadas"); };
function playCurrent(){
var v=document.getElementById("videoEl"), play=document.getElementById("playBtn");
if(!v||!feed.length) return;
try{
v.loop=true; v.playsInline=true;
if(!userTouched){ v.muted=true; } else { v.muted=false; v.volume=1; }
var p=v.play();
if(p) p.then(function(){ if(play) play.style.display="none"; }).catch(function(){
v.muted=true; var p2=v.play(); if(p2) p2.then(function(){ if(play) play.style.display="none"; }).catch(function(){ if(play) play.style.display="flex"; });
});
}catch(e){ if(play) play.style.display="flex"; }
}
function showVideo(i){try{
var v=document.getElementById("videoEl"), play=document.getElementById("playBtn"), counter=document.getElementById("counter"), pubImg=document.getElementById("publisherImg");
if(!feed.length){if(v){try{v.pause();}catch(e){} v.removeAttribute("src"); try{v.load();}catch(e){}} if(play) play.style.display="flex"; if(counter) counter.textContent=""; if(pubImg) pubImg.style.display="none"; return;}
feedIndex=((i%feed.length)+feed.length)%feed.length;
if(v){ v.src=feed[feedIndex].url; }
if(counter) counter.textContent=(feedIndex+1)+" / "+feed.length;
if(pubImg){var ph=feed[feedIndex].photo||myPhoto; if(ph){pubImg.src=ph; pubImg.style.display="block";} else pubImg.style.display="none";}
playCurrent();
}catch(e){}}
function addToFeed(url){if(!url) return; if(url.indexOf("blob:")===0) return; feed.push({url:url,photo:myPhoto}); feedIndex=feed.length-1; showVideo(feedIndex); save();}
function show(id){["home","messages","chat"].forEach(function(x){var el=document.getElementById(x); if(el) el.classList.add("hidden");}); var t=document.getElementById(id); if(t) t.classList.remove("hidden"); closePublish();}
window.show=show; window.goHome=function(){show("home"); playCurrent();};
window.openMessages=function(){unread=0; updateBadge(); renderList(); show("messages");};
function renderList(){try{
var el=document.getElementById("chatList"); if(!el) return; el.innerHTML="";
Object.keys(chats).forEach(function(name){var c=chats[name]||{msgs:[]}; var last=c.msgs.length?c.msgs[c.msgs.length-1][1]:""; var d=document.createElement("div"); d.className="chat-item"; d.onclick=function(){openChat(name);}; d.innerHTML='<div class="avatar"></div><div><b>'+esc(name)+'</b><p>'+esc(last)+'</p></div><span class="arrow">›</span>'; el.appendChild(d);});
}catch(e){}}
function openChat(name){try{current=name; var n=document.getElementById("chatName"); if(n) n.textContent=name; renderMsgs(); show("chat");}catch(e){}}
window.openChat=openChat;
function renderMsgs(){try{var box=document.getElementById("msgs"); if(!box) return; box.innerHTML=""; if(!chats[current]) return; chats[current].msgs.forEach(function(m){var d=document.createElement("div"); d.className="bubble "+(m[0]==="eu"?"me":"other"); d.textContent=m[1]; box.appendChild(d);}); box.scrollTop=box.scrollHeight;}catch(e){}}
window.sendMsg=function(){try{var i=document.getElementById("msgInput"); if(!i||!i.value.trim()||!current) return; if(!chats[current]) chats[current]={msgs:[]}; chats[current].msgs.push(["eu",i.value.trim()]); i.value=""; renderMsgs(); save();}catch(e){}};
var mi=document.getElementById("msgInput"); if(mi) mi.addEventListener("keydown",function(e){if(e.key==="Enter") window.sendMsg();});
function unlock(){ if(userTouched) return; userTouched=true; var v=document.getElementById("videoEl"); if(v){ v.muted=false; v.volume=1; try{ v.play(); }catch(e){} } }
document.addEventListener("touchstart", function(){ unlock(); }, {passive:true});
var startX=0, wrap=document.getElementById("videoWrap");
if(wrap){wrap.addEventListener("touchstart",function(e){try{startX=e.touches[0].clientX;}catch(err){}},{passive:true}); wrap.addEventListener("touchend",function(e){if(!feed.length) return; try{var dx=e.changedTouches[0].clientX-startX; if(dx<-40) showVideo(feedIndex+1); if(dx>40) showVideo(feedIndex-1);}catch(err){}},{passive:true});}
var ve=document.getElementById("videoEl");
var playBtn=document.getElementById("playBtn");
if(ve){
ve.addEventListener("play",function(){ if(playBtn) playBtn.style.display="none"; });
ve.addEventListener("playing",function(){ if(playBtn) playBtn.style.display="none"; });
ve.addEventListener("pause",function(){ if(playBtn) playBtn.style.display="flex"; });
ve.addEventListener("ended",function(){ if(playBtn) playBtn.style.display="flex"; });
ve.addEventListener("click",function(e){ e.stopPropagation(); if(!feed.length) return; try{ if(!userTouched) unlock(); if(ve.paused){ve.play();} else {ve.pause();} }catch(err){} });
}
window.openPublish=function(){var s=document.getElementById("sheet"), o=document.getElementById("overlay"); if(s) s.classList.remove("hidden"); if(o) o.classList.remove("hidden");};
function closePublish(){var s=document.getElementById("sheet"), o=document.getElementById("overlay"); if(s) s.classList.add("hidden"); if(o) o.classList.add("hidden");}
window.closePublish=closePublish;
var gi=document.getElementById("galInput");
if(gi) gi.addEventListener("change",function(e){
  try{
    var f=e.target.files&&e.target.files[0]; if(!f) return;
    if(!f.type||f.type.indexOf("video")!==0){closePublish(); show("home"); toast("Escolhe um vídeo"); return;}
    toast("A enviar vídeo...");
    var fd=new FormData(); fd.append("video", f); fd.append("user","Nick");
    fetch("/upload",{method:"POST",body:fd}).then(function(r){return r.json();}).then(function(data){
      if(data && data.url){ addToFeed(data.url); closePublish(); show("home"); toast("Publicado"); }
      else toast("Não deu para publicar");
    }).catch(function(){ toast("Erro ao enviar"); });
  }catch(err){toast("Não deu para publicar");}
  gi.value="";
});
var pi=document.getElementById("photoInput");
if(pi) pi.addEventListener("change",function(e){try{var f=e.target.files&&e.target.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(ev){ mini.push({type:"photo",data:ev.target.result}); renderMini(); save(); closePublish(); show("home"); toast("Foto publicada"); }; r.readAsDataURL(f);}catch(err){toast("Não deu para publicar");} pi.value="";});
var stream=null;
window.openCamera=function(){closePublish(); var b=document.getElementById("camBox"); if(b) b.classList.remove("hidden"); try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){closeCamera(); toast("Câmara não disponível"); return;} navigator.mediaDevices.getUserMedia({video:true,audio:false}).then(function(s){stream=s; var cv=document.getElementById("camVideo"); if(cv) cv.srcObject=s;}).catch(function(){closeCamera();});}catch(err){closeCamera();}};
window.closeCamera=function(){try{if(stream) stream.getTracks().forEach(function(t){t.stop();});}catch(e){} var b=document.getElementById("camBox"); if(b) b.classList.add("hidden");};
window.invite=function(){try{
var base=window.location.origin+window.location.pathname;
var link=base+"?from="+encodeURIComponent("Nick");
var text="Entra no meu app Nick: "+link;
if(navigator.share){navigator.share({title:"Nick",text:text,url:link}).catch(function(){copyLink(link);});} else copyLink(link);
}catch(e){toast("Não deu para convidar");}};
function copyLink(link){try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(link).then(function(){toast("Link copiado");}).catch(function(){fallbackCopy(link);});} else fallbackCopy(link);}catch(e){fallbackCopy(link);}}
function fallbackCopy(link){try{var ta=document.createElement("textarea"); ta.value=link; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); toast("Link copiado");}catch(e){toast("Copia o link");}}
try{var p=new URLSearchParams(window.location.search); var from=p.get("from"); if(from&&!chats[from]){chats[from]={msgs:[]}; save();}}catch(e){}
function carregarVideos(){
  fetch("/videos").then(function(r){return r.json();}).then(function(list){
    if(list && list.length){
      feed=[]; 
      list.forEach(function(v){ feed.push({url:v.url, photo:myPhoto}); });
      feedIndex=0; showVideo(0); save();
    } else {
      showVideo(0);
    }
  }).catch(function(){ showVideo(0); });
}
updateBadge(); renderMini(); renderList();
carregarVideos();
}catch(e){}})();
</script>
</body>
</html>
